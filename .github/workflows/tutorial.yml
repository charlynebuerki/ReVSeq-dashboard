# Publishes the tutorial notebooks (with their stored outputs) to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: tutorial website

on:
  push:
    branches: [main]
    paths: ["tutorial/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jupyter-book==1.0.3
      - run: jupyter-book build tutorial/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tutorial/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
