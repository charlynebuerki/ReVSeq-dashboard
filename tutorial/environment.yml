# Everything needed to run both tutorial notebooks:
#   conda env create -f tutorial/environment.yml && conda activate revseq-tutorial
name: revseq-tutorial
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  # Part 1: bioinformatics
  - minimap2=2.28
  - samtools=1.21
  - bcftools=1.21
  - snakemake-minimal=7.32.4
  - nextclade=3.18.0
  # Part 2: dashboard (mirrors requirements.txt)
  - biopython=1.84
  - numpy=1.26.3
  - pandas=2.2.2
  - plotly=5.22.0
  - matplotlib=3.9.1
  - nodejs=22
  # Notebooks and the rendered tutorial website
  - jupyterlab=4.2
  - pip
  - pip:
      - Django==5.0.6
      - dna_features_viewer==3.1.3
      - jupyter-book==1.0.3
